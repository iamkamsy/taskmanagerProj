# Local smoke-test only. Do not use in production.
# Copy the root .env.example to backend/.env and fill in real values before running.
# Secrets (MONGO_URI, SECRET_KEY, DB_NAME) are loaded from backend/.env via env_file.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SESSION_COOKIE_SECURE: "false"
      CORS_ORIGINS: "http://localhost"
      FLASK_DEBUG: "false"
      TLS_INSECURE: "false"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
